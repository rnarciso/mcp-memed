[project]
name = "memed-mcp"
version = "0.1.0"
description = "Servidor MCP (cliente agnóstico) para preparar receitas e atestados na Memed, com emissão sempre feita pelo médico."
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
    "mcp>=2.3,<3",
    "httpx>=0.27",
    "uvicorn>=0.30",
    "pydantic>=2.7",
]

[project.optional-dependencies]
dev = ["pytest>=8", "respx>=0.21", "anyio>=4"]

[project.scripts]
memed-mcp = "memed_mcp.__main__:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/memed_mcp"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]
